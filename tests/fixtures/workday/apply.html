<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme Careers - Apply</title></head>
<body>
<div data-automation-id="applyFlowPage">
  <!-- ===================== Step 1: My Information ===================== -->
  <section id="step1" data-step="1">
    <h2>My Information</h2>

    <div data-automation-id="formField-legalNameSection_firstName">
      <label for="first">Given Name(s)<span>*</span></label>
      <input id="first" data-automation-id="legalNameSection_firstName" type="text" aria-required="true">
    </div>
    <div data-automation-id="formField-legalNameSection_lastName">
      <label for="last">Family Name<span>*</span></label>
      <input id="last" data-automation-id="legalNameSection_lastName" type="text" aria-required="true">
    </div>

    <div data-automation-id="formField-countryDropdown">
      <label id="country-label" for="country">Country<span>*</span></label>
      <button id="country" type="button" data-automation-id="countryDropdown" aria-haspopup="listbox" aria-labelledby="country-label"
              data-options="United States of America|Canada|United Kingdom">Select One</button>
    </div>
    <div data-automation-id="formField-addressSection_addressLine1">
      <label for="addr1">Address Line 1<span>*</span></label>
      <input id="addr1" data-automation-id="addressSection_addressLine1" type="text" aria-required="true">
    </div>
    <div data-automation-id="formField-addressSection_city">
      <label for="city">City<span>*</span></label>
      <input id="city" data-automation-id="addressSection_city" type="text" aria-required="true">
    </div>
    <div data-automation-id="formField-addressSection_countryRegion">
      <label id="region-label" for="region">Province<span>*</span></label>
      <button id="region" type="button" data-automation-id="addressSection_countryRegion" aria-haspopup="listbox" aria-labelledby="region-label"
              data-options="Alberta|British Columbia|Ontario|Quebec">Select One</button>
    </div>
    <div data-automation-id="formField-addressSection_postalCode">
      <label for="postal">Postal Code<span>*</span></label>
      <input id="postal" data-automation-id="addressSection_postalCode" type="text" aria-required="true">
    </div>

    <div data-automation-id="formField-phone-device-type">
      <label id="pdt-label" for="pdt">Phone Device Type<span>*</span></label>
      <button id="pdt" type="button" data-automation-id="phone-device-type" aria-haspopup="listbox" aria-labelledby="pdt-label"
              data-options="Home|Mobile|Work">Select One</button>
    </div>
    <div data-automation-id="formField-country-phone-code">
      <label id="cpc-label" for="cpc">Country Phone Code<span>*</span></label>
      <button id="cpc" type="button" data-automation-id="country-phone-code" aria-haspopup="listbox" aria-labelledby="cpc-label"
              data-options="Canada (+1)|United States of America (+1)">Select One</button>
    </div>
    <div data-automation-id="formField-phone-number">
      <label for="phone">Phone Number<span>*</span></label>
      <input id="phone" data-automation-id="phone-number" type="text" aria-required="true">
    </div>

    <div data-automation-id="formField-email">
      <label for="email">Email Address</label>
      <input id="email" data-automation-id="email" type="text">
    </div>

    <button type="button" data-automation-id="bottom-navigation-next-button" id="next1">Save and Continue</button>
  </section>

  <!-- ===================== Step 2: My Experience (hidden until Next) ===================== -->
  <section id="step2" data-step="2" style="display:none">
    <h2>My Experience</h2>
    <div id="work-sections"></div>
    <div id="education-sections"></div>

    <div data-automation-id="resumeSection">
      <label>Resume/CV</label>
      <div data-automation-id="file-upload-drop-zone" id="dropzone">
        <input type="file" data-automation-id="file-upload-input-ref" id="resume-input" style="display:none">
        <button type="button">Select files</button>
        <span id="file-name"></span>
      </div>
    </div>

    <button type="button" data-automation-id="bottom-navigation-next-button" id="next2">Save and Continue</button>
  </section>
</div>

<script>
  window.__syntheticNextClicks = 0;
  window.__nextClicks = 0;

  // Work-experience sections as Workday renders them: ids like "workExperience-4--jobTitle", numbered
  // from an arbitrary offset (the page does not start at 1 once sections have been added or removed).
  const monthBox = (id, prefix, which, part) => `
    <input id="${id}" data-automation-id="dateSection${part}-input" type="text" placeholder="${part === 'Month' ? 'MM' : 'YYYY'}">`;
  const workSection = (n, label) => `
    <div data-automation-id="workExperience-${n}" id="workExperience-${n}">
      <h3>${label}</h3>
      <div data-automation-id="formField-jobTitle"><label for="workExperience-${n}--jobTitle">Job Title<span>*</span></label>
        <input id="workExperience-${n}--jobTitle" data-automation-id="jobTitle" type="text" aria-required="true"></div>
      <div data-automation-id="formField-companyName"><label for="workExperience-${n}--companyName">Company<span>*</span></label>
        <input id="workExperience-${n}--companyName" data-automation-id="companyName" type="text" aria-required="true"></div>
      <div data-automation-id="formField-location"><label for="workExperience-${n}--location">Location</label>
        <input id="workExperience-${n}--location" data-automation-id="location" type="text"></div>
      <div data-automation-id="formField-currentlyWorkHere">
        <input id="workExperience-${n}--currentlyWorkHere" data-automation-id="currentlyWorkHere" type="checkbox">
        <label for="workExperience-${n}--currentlyWorkHere">I currently work here</label></div>
      <div data-automation-id="formField-startDate"><label>From</label>
        ${monthBox(`workExperience-${n}--startDate-dateSectionMonth-input`, 'start', 'start', 'Month')}
        ${monthBox(`workExperience-${n}--startDate-dateSectionYear-input`, 'start', 'start', 'Year')}</div>
      <div data-automation-id="formField-endDate"><label>To (Actual or Expected)</label>
        ${monthBox(`workExperience-${n}--endDate-dateSectionMonth-input`, 'end', 'end', 'Month')}
        ${monthBox(`workExperience-${n}--endDate-dateSectionYear-input`, 'end', 'end', 'Year')}</div>
      <div data-automation-id="formField-roleDescription"><label for="workExperience-${n}--roleDescription">Role Description</label>
        <textarea id="workExperience-${n}--roleDescription" data-automation-id="roleDescription"></textarea></div>
    </div>`;
  document.getElementById('work-sections').innerHTML = [4, 5, 6, 7].map((n, i) => workSection(n, `Work Experience ${i + 1}`)).join('');

  document.getElementById('education-sections').innerHTML = `
    <div data-automation-id="education-2" id="education-2">
      <h3>Education 1</h3>
      <div data-automation-id="formField-schoolName"><label for="education-2--schoolName">School or University<span>*</span></label>
        <input id="education-2--schoolName" data-automation-id="schoolName" type="text" aria-required="true"></div>
      <div data-automation-id="formField-degree"><label id="deg-label" for="education-2--degree">Degree</label>
        <button id="education-2--degree" type="button" data-automation-id="degree" aria-haspopup="listbox" aria-labelledby="deg-label"
                data-options="High School|Associate's Degree|Bachelor's Degree|Master's Degree|Doctorate">Select One</button></div>
      <div data-automation-id="formField-fieldOfStudy"><label for="education-2--fieldOfStudy">Field of Study</label>
        <input id="education-2--fieldOfStudy" data-automation-id="fieldOfStudy" type="text"></div>
      <div data-automation-id="formField-firstYearAttended"><label>From</label>
        <input id="education-2--firstYearAttended-dateSectionYear-input" data-automation-id="dateSectionYear-input" type="text" placeholder="YYYY"></div>
      <div data-automation-id="formField-lastYearAttended"><label>To (Actual or Expected)</label>
        <input id="education-2--lastYearAttended-dateSectionYear-input" data-automation-id="dateSectionYear-input" type="text" placeholder="YYYY"></div>
    </div>`;

  // Next / Save and Continue: only a real (trusted) user click advances; synthetic clicks are counted.
  document.querySelectorAll('[data-automation-id="bottom-navigation-next-button"]').forEach((b) =>
    b.addEventListener('click', (e) => {
      window.__nextClicks++;
      if (!e.isTrusted) window.__syntheticNextClicks++;
      else if (b.id === 'next1') {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = '';
      }
    }),
  );

  // Workday-style listbox buttons: open a portal listbox; picking an option writes its text into the button.
  // The option text sits in an inner span and ONLY that span has the click handler, like some real widgets.
  if (!window.__wdListboxInstalled) document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[aria-haspopup="listbox"]');
    if (!btn) return;
    document.querySelectorAll('ul[role="listbox"]').forEach((u) => u.remove());
    const ul = document.createElement('ul');
    ul.setAttribute('role', 'listbox');
    for (const text of btn.dataset.options.split('|')) {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('data-automation-id', 'promptOption');
      const span = document.createElement('span');
      span.textContent = text;
      span.addEventListener('click', () => {
        btn.textContent = text;
        ul.remove();
      });
      li.appendChild(span);
      ul.appendChild(li);
    }
    document.body.appendChild(ul);
  });
  window.__wdListboxInstalled = true;

  // Resume upload: shows the file name once it has been accepted. In "drop-only" mode (as on some real
  // Workday pages) the hidden input's change event is ignored and only a drop on the zone counts.
  const input = document.getElementById('resume-input');
  const zone = document.getElementById('dropzone');
  const shown = document.getElementById('file-name');
  input.addEventListener('change', () => {
    if (window.__uploadMode !== 'drop-only' && input.files[0]) shown.textContent = input.files[0].name;
  });
  zone.addEventListener('dragover', (e) => e.preventDefault());
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) shown.textContent = f.name;
  });
</script>
</body>
</html>
