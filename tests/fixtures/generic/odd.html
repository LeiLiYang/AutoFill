<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - Quirky Co</title></head>
<body>
<h1>Apply to Quirky Co</h1>
<!-- Labels no rule recognises: only a model reading them can tell what they ask for. -->
<form id="f" action="/submit" method="post">
  <label for="a">First name</label><input id="a">
  <label for="b">Where do you hang your hat?</label><input id="b">
  <label for="c">Favourite pizza topping</label><input id="c">
  <button type="submit" id="go">Send it</button>
</form>
</body>
</html>
